allowBuilds:
  '@scarf/scarf': false # telemetry, blocked before it can arrive as a transitive dependency
  esbuild: false

blockExoticSubdeps: true

catalog:
  '@types/express-serve-static-core': ^5.1.3
  '@types/node': ^24.19.2
  eventsource-parser: ^4.1.3
  express: ^5.3.0
  express4: npm:express@^4.22.3
  fast-check: ^4.10.2
  jose: ^6.2.15
  prettier: ^3.9.10
  tsdown: 0.23.5
  tsx: ^4.23.15
  typescript: ~7.0.2
  undici: ^8.12.4
  zod: ^4.6.7

minimumReleaseAge: 1440

packages:
  - apps/*
  - modules/*

strictDepBuilds: true

strictPeerDependencies: true

trustPolicy: no-downgrade

verifyDepsBeforeRun: error
